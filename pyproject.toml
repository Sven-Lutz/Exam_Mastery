[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-mastery-engine"
version = "0.21.0rc1"
description = "Source-grounded adaptive learning production engine; independent QA and blind-test support"
requires-python = ">=3.10"
dependencies = ["pypdf>=4.0", "python-pptx>=0.6.23", "python-docx>=1.1", "reportlab>=4.0", "jsonschema>=4.0", "openpyxl>=3.1", "Pillow>=10", "httpx>=0.27", "sympy==1.14.0", "matplotlib==3.10.7", "svglib==1.5.1"]

[project.scripts]
exam-mastery = "exam_mastery.cli:main"
exam-mastery-start = "exam_mastery.onepath:main"
mastery = "exam_mastery.mastery.__main__:main"

[tool.setuptools.package-data]
exam_mastery = ["templates/*", "prompts/*.txt", "profiles.json", "math_runtime/*.cjs", "knowledge/*.json", "knowledge/subject/*.json", "mastery/*.json"]

[project.optional-dependencies]
qa = ["PyMuPDF>=1.24", "playwright>=1.45", "anki==26.9.3"]
gemini = ["google-genai>=1.0"]

[tool.setuptools.packages.find]
include = ["exam_mastery*"]

[tool.pytest.ini_options]
pythonpath = ["."]
