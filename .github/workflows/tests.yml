name: tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: pip install -r requirements-math-tested.txt -r requirements-gemini-tested.txt pytest
      - run: npm install --prefix ~/.cache/exam-mastery-v05-node --save-exact mathjax-full@3.2.2 @fontsource/source-sans-3@5.1.0 @fontsource/source-serif-4@5.1.0 @fontsource/jetbrains-mono@5.1.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_publication_lock.py tests/test_attention_reference.py tests/test_experience_core.py tests/test_experience_evidence.py tests/test_experience_adaptation.py tests/test_experience_misconceptions.py tests/test_experience_proof_checks.py tests/test_interactive_reference.py tests/test_experience_anki.py tests/test_experience_books.py tests/test_experience_pipeline.py tests/test_attention_deepening.py tests/test_policy_gradient_lab.py tests/test_mastery_motion.py tests/test_motion_keyframes_products.py tests/test_plane_map_lab.py
      - run: python -m unittest discover -s tests
      - run: bash -n release/install.sh && bash -n release/skill/exam-mastery/scripts/check_host.sh
